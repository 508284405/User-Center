<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(34, 211, 238, 0.3)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <!-- Additional tech grid overlay -->
  <defs>
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="rgba(34, 211, 238, 0.2)"/>
      <path d="M 0 20 L 40 20 M 20 0 L 20 40" fill="none" stroke="rgba(34, 211, 238, 0.15)" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#techGrid)" opacity="0.5"/>
</svg>