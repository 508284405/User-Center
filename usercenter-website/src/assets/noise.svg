<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0.1 0.2 0.3 0.2 0.1 0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  
  <!-- Base noise pattern -->
  <rect width="100%" height="100%" filter="url(#noiseFilter)" opacity="0.4"/>
  
  <!-- Additional fine grain noise -->
  <defs>
    <filter id="fineNoise">
      <feTurbulence type="turbulence" baseFrequency="2.5" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0.05 0.1 0.05 0"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#fineNoise)" opacity="0.3"/>
  
  <!-- Subtle tech grain -->
  <g opacity="0.2">
    <circle cx="23" cy="45" r="0.5" fill="rgba(34, 211, 238, 0.3)"/>
    <circle cx="67" cy="89" r="0.3" fill="rgba(14, 165, 233, 0.4)"/>
    <circle cx="145" cy="23" r="0.4" fill="rgba(103, 232, 249, 0.2)"/>
    <circle cx="189" cy="156" r="0.3" fill="rgba(34, 211, 238, 0.35)"/>
    <circle cx="12" cy="178" r="0.5" fill="rgba(14, 165, 233, 0.25)"/>
    <circle cx="156" cy="67" r="0.2" fill="rgba(103, 232, 249, 0.3)"/>
    <circle cx="78" cy="134" r="0.4" fill="rgba(34, 211, 238, 0.2)"/>
    <circle cx="134" cy="178" r="0.3" fill="rgba(14, 165, 233, 0.4)"/>
  </g>
</svg>